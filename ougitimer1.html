<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ougitimer</title>

<style>
body{
  font-family:sans-serif;
  background:#f2f2f2;
  margin:10px;
  font-size:14px;
}
.box{
  background:#fff;
  border:1px solid #999;
  padding:6px;
  margin-bottom:6px;
}
button{
  margin:2px;
  padding:4px 8px;
  font-size:13px;
  background:#eee;
  border:1px solid #777;
  cursor:pointer;
}
button.selected{
  background:#3399ff;
  color:#fff;
  font-weight:bold;
}
input{
  font-size:13px;
  width:50px;
}
.row{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
}
.result{
  padding:6px;
  font-weight:bold;
}
.wait{color:#666;}
.active{color:#d40000;}
.done{color:#999;}
</style>
</head>

<body>

<h2>奥義タイマー</h2>

<!-- 残り時間 -->
<div class="box">
  <div class="row">
    <b>残り</b>&nbsp;
    <input id="min" type="number" value="30">分
    <input id="sec" type="number" value="0">秒
    <button onclick="start()">開始</button>
    &nbsp;→ <span id="timer">--:--</span>
  </div>
</div>

<!-- カテゴリ -->
<div class="box">
  <div class="row">
    <b>カテゴリ</b>&nbsp;
    <button onclick="selectCategory('jin')">陣</button>
    <button onclick="selectCategory('ori')">織り手</button>
    <button onclick="selectCategory('suhai')">崇拝</button>
    <button onclick="selectCategory('rikisen')">力線</button>
  </div>
</div>

<!-- 奥義 -->
<div class="box">
  <div class="row" id="ougiArea"><b>奥義</b></div>
</div>

<!-- Lv -->
<div class="box">
  <div class="row" id="lvArea"><b>Lv</b></div>
</div>

<!-- 表示 -->
<div class="box">
  <button onclick="calc()">表示</button>
  <button onclick="copyResult()">コピー</button>
  <div id="result" class="result">---</div>
</div>

<script>
let remain=0,timerId=null;
let selectedCategory=null,selectedOugi=null,selectedLv=1;
let calcData=null;

const DATA={
  jin:{
    maxLv:20,
    names:["煉獄の陣","蒼嵐の陣","群葉の陣","閃耀の陣","冥闇の陣"],
    times:[
      [90,90],[88,92],[84,96],[82,98],[80,100],[79,101],[78,102],[77,103],[76,104],[75,105],
      [74,106],[73,107],[72,108],[71,109],[70,110],[69,111],[68,112],[67,113],[66,114],[65,115]
    ]
  },
  ori:{
    maxLv:6,
    names:["魂の織り手","憎悪の織り手"],
    times:[[180,50],[170,60],[160,70],[150,80],[140,90],[130,100]]
  },
  suhai:{
    maxLv:6,
    names:["崇拝の言葉"],
    times:[[180,120],[170,130],[160,140],[150,150],[140,160],[130,170]]
  },
  rikisen:{
    maxLv:7,
    names:["処罰の力線","予期の力線","活力の力線"],
    times:[[180,120],[170,130],[160,140],[150,150],[140,160],[130,170],[120,180]]
  }
};

function start(){
  remain=Number(min.value)*60+Number(sec.value);
  if(timerId)clearInterval(timerId);
  update();
  timerId=setInterval(()=>{
    remain--;
    update();
    updateStatus();
    if(remain<=0)clearInterval(timerId);
  },1000);
}

function update(){
  timer.textContent=
    String(Math.floor(remain/60)).padStart(2,"0")+":"+
    String(remain%60).padStart(2,"0");
}

function selectCategory(cat){
  selectedCategory=cat;
  selectedOugi=null;
  renderOugi();
  renderLv(DATA[cat].maxLv);
}

function renderOugi(){
  ougiArea.innerHTML="<b>奥義</b>";
  DATA[selectedCategory].names.forEach(n=>{
    const b=document.createElement("button");
    b.textContent=n;
    b.onclick=()=>{selectedOugi=n;mark(ougiArea,b)};
    ougiArea.appendChild(b);
  });
}

function renderLv(max){
  lvArea.innerHTML="<b>Lv</b>";
  for(let i=1;i<=max;i++){
    const b=document.createElement("button");
    b.textContent=i;
    b.onclick=()=>{selectedLv=i;mark(lvArea,b)};
    lvArea.appendChild(b);
  }
}

function mark(area,btn){
  [...area.children].forEach(x=>x.classList.remove("selected"));
  btn.classList.add("selected");
}

function calc(){
  if(!selectedOugi)return;
  const t=DATA[selectedCategory].times[selectedLv-1];
  calcData={
    name:selectedOugi,
    lv:selectedLv,
    start:remain-t[0],
    end:remain-t[0]-t[1]
  };
  updateStatus();
}

function updateStatus(){
  if(!calcData)return;
  let status="待機中",cls="wait";
  if(remain<=calcData.start && remain>calcData.end){
    status="発動中";
    cls="active";
  }else if(remain<=calcData.end){
    status="終了";
    cls="done";
  }
  result.className="result "+cls;
  result.textContent=
    `${calcData.name} Lv${calcData.lv} ｜ ${status} ｜ `+
    `${fmt(calcData.start)}～${fmt(calcData.end)}`;
}

function fmt(v){
  if(v<0)v=0;
  return String(Math.floor(v/60)).padStart(2,"0")+":"+
         String(v%60).padStart(2,"0");
}

/* 完全サイレントコピー */
function copyResult(){
  const text=result.textContent;
  if(text && text!=="---"){
    navigator.clipboard.writeText(text);
  }
}
</script>

</body>
</html>
